name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  launcher:
    runs-on:
      group: Default
      labels: [self-hosted, Windows, ARM64, mac-server]
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4


      # Self-hosted Windows runners run the service as LocalSystem; Git Bash
      # (C:\Program Files\Git\bin) is installed but not on the service PATH, so
      # `shell: bash` steps like dtolnay/rust-toolchain fail with
      # "bash: command not found". $GITHUB_PATH entries feed the runner's
      # prepend-path list used to resolve step shells.
      - name: Add Git Bash to PATH
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe') -PathType Leaf) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $gitBin
          } else {
            Write-Warning "Git Bash not found at $gitBin"
          }
      # The fleet has no C++ toolchain — provision MSVC Build Tools so
      # windows-msvc targets can link (rustc locates them via vswhere).
      # winget is unavailable in the runner's LocalSystem context, so use
      # the official bootstrapper. No-op once installed.
      - name: Ensure MSVC Build Tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = (Test-Path $vswhere) -and [bool](& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($found) { Write-Host 'MSVC Build Tools already installed'; exit 0 }
          Write-Host 'Downloading VS 2022 Build Tools bootstrapper...'
          $bt = Join-Path $env:TEMP 'vs_buildtools.exe'
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $bt -TimeoutSec 120 -UseBasicParsing
              $ok = $true; break
            } catch { Write-Warning "download attempt $i failed: $($_.Exception.Message)"; Start-Sleep 10 }
          }
          if (-not $ok) { throw 'could not download vs_buildtools.exe' }
          & $bt --passive --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended | Out-Host
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "vs_buildtools exit $LASTEXITCODE" }
          $found = [bool](& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (-not $found) { throw 'Build Tools install did not register VCTools' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: cargo build --release
        run: cargo build --release

      # ARM64 runners have no rc.exe/windres — inject icon + manifest +
      # version info post-build via Win32 BeginUpdateResource instead.
      - name: Embed resources
        shell: pwsh
        run: |
          $ver = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9.]+)"').Groups[1].Value
          if (($ver -split '\.').Count -eq 3) { $ver = "$ver.0" }
          ./embed-resources.ps1 -ExePath target/release/httk-launcher.exe -IcoPath assets/httk.ico -ManifestPath app.manifest -Version $ver
          $exe = Resolve-Path target/release/httk-launcher.exe
          if ((Get-Item $exe).VersionInfo.FileVersion -ne $ver) { throw "version info missing after embed" }
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $ico -or $ico.Width -lt 16) { throw "icon missing after embed" }

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath target\release\httk-launcher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  httk-launcher.exe" | Out-File -FilePath target\release\httk-launcher.exe.sha256 -Encoding ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
          }
          gh release upload ${{ github.ref_name }} target\release\httk-launcher.exe target\release\httk-launcher.exe.sha256 --clobber
