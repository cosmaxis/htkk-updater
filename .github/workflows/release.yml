name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: cargo build --release
        env:
          HTKK_REQUIRE_RESOURCES: "1"
        run: cargo build --release

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath target\release\htkk-launcher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  htkk-launcher.exe" | Out-File -FilePath target\release\htkk-launcher.exe.sha256 -Encoding ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
          }
          gh release upload ${{ github.ref_name }} target\release\htkk-launcher.exe target\release\htkk-launcher.exe.sha256 --clobber
